name: Publish

on:
  push:
    tags:
      - 'consent-*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Determine package directory from tag
        id: pkg
        # Tag format is "<component>-v<version>", e.g. "consent-core-v0.2.0".
        # The component name matches the package directory name under packages/.
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR_NAME="${TAG%-v*}"
          echo "dir=packages/${PKG_DIR_NAME}" >> "$GITHUB_OUTPUT"
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
