name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/astro.md'
      - 'SPECIFICATION.md'
      - 'MIGRATION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow one concurrent deployment per branch; cancel any in-flight
# previous run so a fast follow-up commit ships sooner.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @privion-consent/docs-site build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
