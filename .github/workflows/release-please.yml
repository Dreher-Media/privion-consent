name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          # Use a PAT (or GitHub App token) so release PRs are opened by a
          # user account, not GITHUB_TOKEN. PRs opened with GITHUB_TOKEN do
          # not trigger pull_request workflows, which means CI never runs on
          # the release PR. Falls back to GITHUB_TOKEN if the secret is unset
          # (release PR will still open, just won't trigger CI).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
