name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release-please.yml dispatches this on each release PR's branch: release
  # PRs are opened with GITHUB_TOKEN, and events caused by that token do not
  # start pull_request runs, so without this the required checks would never
  # report on them.
  workflow_dispatch:
    inputs:
      pr-title:
        description: Title of the PR being checked (linted like a PR title)
        required: true
        type: string

permissions: {}

jobs:
  lint-pr-title:
    # Lint the PR title against Conventional Commits. Because PRs are squash-merged,
    # the PR title becomes the commit on the integration branch and is what
    # release-please reads. Malformed titles break the release pipeline.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title || inputs.pr-title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
